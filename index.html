<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토의 사회자</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #eef3fb; color: #1b2540;
  }
  button { font-family: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: .45; }

  /* 책 고르기 화면 */
  #pick {
    min-height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center;
  }
  #pick h1 { margin: 0; font-size: 40px; }
  #pick p { margin: 0 0 8px; font-size: 20px; color: #4a5878; }
  #pickList { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; }
  .pickBtn {
    font-size: 24px; font-weight: 700; padding: 26px 34px; min-width: 240px;
    background: #fff; color: #1b2540; border: 3px solid #2f6fed; border-radius: 18px;
  }
  .pickBtn:hover, .pickBtn:focus { background: #2f6fed; color: #fff; outline: none; }

  /* 진행 화면 */
  #stage {
    max-width: 1120px; min-height: 100%; margin: 0 auto; padding: 18px 20px 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #bookTitle { font-size: 24px; font-weight: 800; margin-right: auto; }
  .chip {
    background: #2f6fed; color: #fff; font-weight: 700; font-size: 18px;
    padding: 6px 14px; border-radius: 999px;
  }
  #count { font-size: 18px; color: #4a5878; font-variant-numeric: tabular-nums; }
  .ghost {
    background: transparent; border: 1px solid #b8c4de; color: #4a5878;
    font-size: 15px; padding: 7px 12px; border-radius: 10px;
  }
  .bar { height: 8px; background: #d6e0f3; border-radius: 4px; overflow: hidden; }
  #barFill { height: 100%; width: 0; background: #2f6fed; transition: width .3s; }

  main { flex: 1; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .char {
    flex: 0 0 auto; width: min(300px, 60vw); aspect-ratio: 520 / 572; position: relative;
    background: #fff; border: 3px solid #d6e0f3; border-radius: 24px; overflow: hidden;
  }
  .bubble {
    flex: 1 1 380px; position: relative; background: #fff; border: 3px solid #2f6fed;
    border-radius: 24px; padding: 28px 30px 44px; min-height: 220px;
    display: flex; align-items: center;
  }
  .bubble::before {
    content: ""; position: absolute; left: -17px; top: 50%; width: 28px; height: 28px;
    background: #fff; border-left: 3px solid #2f6fed; border-bottom: 3px solid #2f6fed;
    transform: translateY(-50%) rotate(45deg);
  }
  #lineBox { width: 100%; }
  #line { margin: 0; font-size: clamp(22px, 3vw, 34px); line-height: 1.55; font-weight: 600; word-break: keep-all; }
  #line.long { font-size: clamp(19px, 2.4vw, 27px); }
  #line.fade { animation: fadeIn .35s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .topic { color: #2f6fed; font-weight: 800; }
  #dots { position: absolute; left: 30px; bottom: 16px; display: flex; gap: 7px; }
  #dots span { width: 10px; height: 10px; border-radius: 50%; background: #d6e0f3; }
  #dots span.on { background: #2f6fed; }
  .wave { position: absolute; right: 22px; bottom: 14px; display: flex; gap: 4px; align-items: flex-end; height: 22px; visibility: hidden; }
  .wave span { width: 5px; height: 6px; background: #2f6fed; border-radius: 2px; }
  .voicing .wave { visibility: visible; }
  .voicing .wave span { animation: wave .5s ease-in-out infinite alternate; }
  .voicing .wave span:nth-child(2) { animation-delay: .1s; }
  .voicing .wave span:nth-child(3) { animation-delay: .2s; }
  .voicing .wave span:nth-child(4) { animation-delay: .3s; }
  .voicing .wave span:nth-child(5) { animation-delay: .4s; }
  @keyframes wave { from { height: 5px; } to { height: 22px; } }

  /* 캐릭터 움직임 */
  .char .inner { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform: translateY(5px); will-change: transform; }
  .char .pic {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    background-repeat: no-repeat; background-position: center; background-size: 100% 100%;
    pointer-events: none;
  }
  .char .closed { opacity: 0; will-change: opacity; }
  .voicing .char .closed { animation: flap .34s steps(1, end) infinite; }
  @keyframes flap { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }
  .voicing .char .inner { animation: bob .55s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(5px); } to { transform: translateY(0); } }

  footer { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 12px; align-items: stretch; }
  footer button {
    font-size: 20px; font-weight: 700; padding: 18px 10px; border-radius: 16px;
    background: #fff; color: #1b2540; border: 2px solid #b8c4de;
  }
  footer .primary { font-size: 28px; background: #2f6fed; color: #fff; border-color: #2f6fed; padding: 22px 10px; }
  #nextHint { grid-column: 1 / -1; margin: 0; text-align: center; font-size: 17px; color: #4a5878; }

  details { font-size: 15px; color: #4a5878; }
  details summary { cursor: pointer; }
  .settings { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding-top: 10px; }
  .help { margin: 8px 0 0; font-size: 14px; line-height: 1.5; }
  #voiceNow { font-weight: 700; color: #1b2540; }
  .settings select, .settings button { font-family: inherit; font-size: 15px; padding: 6px 8px; }
  #notice { margin: 0; padding: 10px 14px; background: #fff4d6; border: 1px solid #e0b84a; border-radius: 10px; font-size: 15px; }

  @media (max-width: 640px) {
    .bubble::before { display: none; }
    footer { grid-template-columns: 1fr 1fr; }
    footer .primary { grid-column: 1 / -1; grid-row: 1; }
  }
</style>
</head>

    목록에서 바꿔도 소리가 같다면 그 기기의 브라우저가 목소리 선택을 지원하지 않는 것입니다. 그럴 때는 기기 설정의 '텍스트 음성 변환(TTS)'에서 바꿔 주세요.</p>
  </details>
</div>

<script>
/* ===== 대본 시작 =====
   BOOKS  : 책 제목과 토의 주제
   STAGES : 번호(0~4)별 멘트. lines 의 한 줄이 화면에 한 번에 보이는 한 문장이고, {주제} 자리에 책별 주제가 들어갑니다. */
const BOOKS = [
  {
    title: "원통 안의 소녀",
    topic: "우리와 조금 다르거나(질병, 장애, 성격 등) 소외된 친구가 학교생활을 함께 잘해나갈 수 있도록, 우리 학급이나 학교에서 해줄 수 있는 배려 방법은 무엇일까?"
  },
  {
    title: "하트의 탄생",
    topic: "'좋아요'나 '조회수', 남들의 시선에 휘둘리지 않고, 나 자신을 지키면서 즐겁게 SNS를 이용하는 방법은 무엇일까?"
  },
  {
    title: "푸른파 피망",
    topic: "서로 패를 가르고 싸우거나 멀어진 친구들의 사이가 해결될 수 있도록, 우리 학급이나 학교에서 해줄 수 있는 방법은 무엇일까?"
  }
];
const STAGES = [
  {
    step: "준비",
    lines: [
      "토의할 준비가 끝났다면, 다른 디벗 기기로 녹음을 시작한 후 아래의 [토의 시작] 버튼을 눌러 주세요."
    ]
  },
  {
    step: "방안 발표",
    lines: [
      "지금부터 {주제}를 주제로 토의를 시작하겠습니다.",
      "먼저 이 문제와 관련하여 각 토의자가 마련한 해결 방안을 듣겠습니다.",
      "그다음 토의자끼리 의견을 교환하는 과정을 거쳐 대안을 마련하고자 합니다.",
      "돌아가면서 의견을 말씀해 주세요."
    ]
  },
  {
    step: "의견 교환",
    lines: [
      "지금까지 {주제}에 대한 다양한 방안을 말씀해 주셨습니다.",
      "이제 토의자끼리 의견을 교환하도록 하겠습니다.",
      "토의자는 돌아가며 서로 제시한 해결방안에 관해 질문해 주세요."
    ]
  },
  {
    step: "토의 마무리",
    lines: [
      "지금까지 토의자 분들이 제시한 해결 방안에 관해 의견을 나누었습니다.",
      "토의에 적극적으로 참여하여 의미 있는 대안을 마련해 주신 여러분 모두 고맙습니다.",
      "이것으로 오늘 토의를 마치겠습니다."
    ]
  },
  {
    step: "녹음 제출",
    lines: [
      "토의를 다 마친 학생은 녹음 파일을 저장하여 구글 클래스룸에 업로드해 주세요."
    ]
  }
];
/* ===== 대본 끝 ===== */

const GAP = 450;          /* 문장과 문장 사이 쉬는 시간(밀리초) */
const MS_PER_CHAR = 190;  /* 소리가 안 날 때 자막을 넘기는 속도(글자당 밀리초) */
const MIN_MS = 1800;
const LAST = STAGES.length - 1;

const $ = function (id) { return document.getElementById(id); };
const store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;

let voices = [];
let voiceSig = null;
let rate = parseFloat(store.get('mcRate')) || 0.95;
let pitch = parseFloat(store.get('mcPitch')) || 1.15;
let book = null;
let stage = 0;
let sent = 0;
let speaking = false;
let token = 0;
const keep = [];

function showNotice(msg) {
  $('notice').textContent = msg;
  $('notice').hidden = false;
}

/* ---------- 목소리 ---------- */
function voiceKey(v) { return (v.voiceURI || '') + '|' + v.name; }
function koVoices() {
  if (!synth) { return []; }
  const score = function (v) {
    return (/natural|online/i.test(v.name) ? 4 : 0) + (/google/i.test(v.name) ? 2 : 0) +
      (/sunhi|yuna|heami|sora|yujin/i.test(v.name) ? 1 : 0);
  };
  const list = (synth.getVoices() || []).filter(function (v) {
    return (v.lang || '').replace('_', '-').toLowerCase().indexOf('ko') === 0;
  });
  list.sort(function (a, b) { return (score(b) - score(a)) || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0); });
  return list;
}
/* 말할 때마다 저장된 선택을 다시 찾아서 씁니다. 저장된 목소리가 아직 목록에 없으면 첫 번째 목소리를 쓰되, 저장값은 지우지 않습니다. */
function currentVoice() {
  const saved = store.get('mcVoiceKey');
  let found = null;
  voices.forEach(function (v) { if (!found && voiceKey(v) === saved) { found = v; } });
  return found || voices[0] || null;
}
function loadVoices() {
  if (!synth) { return; }
  const list = koVoices();
  const sig = list.map(voiceKey).join('\n');
  const sel = $('voiceSel');
  if (sig !== voiceSig) {
    voiceSig = sig;
    voices = list;
    sel.textContent = '';
    voices.forEach(function (v) {
      const o = document.createElement('option');
      o.value = voiceKey(v);
      o.textContent = v.name;
      sel.appendChild(o);
    });
  }
  const v = currentVoice();
  if (v) {
    sel.value = voiceKey(v);
    $('voiceNow').textContent = v.name;
    $('notice').hidden = true;
  }
}

/* ---------- 문장 만들기 ---------- */
function speechText(line) {
  const topic = book.topic.replace(/\?\s*$/, '').replace(/[()]/g, ', ');
  return line.replace('{주제}', topic)
    .replace(/["'“”‘’\[\]《》]/g, '')
    .replace(/\s+/g, ' ')
    .replace(/\s+,/g, ',')
    .replace(/,(\s*,)+/g, ',')
    .trim();
}
/* 긴 문장은 쉼표에서 나누어 읽습니다(일부 브라우저가 긴 문장을 읽다가 멈추는 문제를 피하기 위함). 화면에는 한 문장 그대로 보입니다. */
function chunks(text) {
  if (text.length <= 60) { return [text]; }
  const parts = text.match(/[^,]+,?\s*/g) || [text];
  const out = [];
  let cur = '';
  parts.forEach(function (p) {
    if (cur && (cur + p).length > 60) { out.push(cur.trim()); cur = p; }
    else { cur += p; }
  });
  if (cur.trim()) { out.push(cur.trim()); }
  return out;
}
function estimate(text) { return Math.max(MIN_MS, text.length * MS_PER_CHAR / rate); }

/* ---------- 말하기 ---------- */
function setVoicing(v) { document.body.classList.toggle('voicing', v); }
function setSpeaking(v) {
  speaking = v;
  if (!v) { setVoicing(false); }
  render(false);
}
function stopSpeaking() {
  token += 1;
  if (synth) { synth.cancel(); }
  setSpeaking(false);
}

/* 한 조각을 읽고, 끝나면 done 을 부릅니다. 소리가 안 나거나 끝났다는 신호가 안 와도 멈추지 않도록 시간으로 보완합니다. */
function speakOne(my, text, done) {
  let finished = false, started = false, idle = 0, poll = null, cap = null, fb = null;
  const t0 = Date.now();
  const est = estimate(text);
  function finish() {
    if (finished) { return; }
    finished = true;
    if (poll) { clearInterval(poll); }
    if (cap) { clearTimeout(cap); }
    if (fb) { clearTimeout(fb); }
    if (my === token) { done(); }
  }
  function fallback() {
    if (finished || fb) { return; }
    if (poll) { clearInterval(poll); poll = null; }
    fb = setTimeout(finish, Math.max(300, est - (Date.now() - t0)));
  }
  if (!synth) { fallback(); return; }
  const u = new SpeechSynthesisUtterance(text);
  const v = currentVoice();
  if (v) { u.voice = v; u.lang = v.lang || 'ko-KR'; } else { u.lang = 'ko-KR'; }
  u.rate = rate;
  u.pitch = pitch;
  u.onstart = function () { started = true; };
  u.onend = finish;
  u.onerror = function () { if (my === token) { fallback(); } };
  keep.push(u);
  try { synth.speak(u); } catch (e) { fallback(); return; }
  poll = setInterval(function () {
    if (my !== token) { clearInterval(poll); return; }
    if (synth.speaking || synth.pending) { started = true; idle = 0; return; }
    idle += 1;
    if (started && idle >= 3) { finish(); }
    else if (!started && idle >= 8) { fallback(); }
  }, 300);
  cap = setTimeout(finish, est * 2 + 6000);
}
function speakChunks(my, parts, k, done) {
  if (my !== token) { return; }
  if (k >= parts.length) { done(); return; }
  speakOne(my, parts[k], function () { speakChunks(my, parts, k + 1, done); });
}
/* 한 번호 안의 문장을 버튼 없이 한 문장씩 차례로 보여 주며 읽습니다. */
function runStage(my, i) {
  if (my !== token) { return; }
  const list = STAGES[stage].lines;
  sent = i;
  render(true);
  setVoicing(true);
  speakChunks(my, chunks(speechText(list[i])), 0, function () {
    setVoicing(false);
    if (i < list.length - 1) {
      setTimeout(function () { runStage(my, i + 1); }, GAP);
    } else {
      setSpeaking(false);
    }
  });
}
function play(s) {
  token += 1;
  if (synth && (synth.speaking || synth.pending)) { synth.cancel(); }
  keep.length = 0;
  stage = s;
  speaking = true;
  runStage(token, 0);
}
function speakSample() {
  token += 1;
  const my = token;
  if (synth && (synth.speaking || synth.pending)) { synth.cancel(); }
  keep.length = 0;
  speaking = true;
  render(false);
  setVoicing(true);
  speakOne(my, '안녕하세요. 저는 오늘 토의의 사회자입니다.', function () { setSpeaking(false); });
}

/* ---------- 화면 ---------- */
function stepName(s) { return s === 0 ? STAGES[0].step : s + '. ' + STAGES[s].step; }
function drawLine(text) {
  const el = $('line');
  el.textContent = '';
  const parts = text.split('{주제}');
  parts.forEach(function (p, i) {
    if (i > 0) {
      const span = document.createElement('span');
      span.className = 'topic';
      span.textContent = '“' + book.topic + '”';
      el.appendChild(span);
    }
    if (p) { el.appendChild(document.createTextNode(p)); }
  });
  el.classList.toggle('long', parts.length > 1);
}
function render(changed) {
  if (!book) { return; }
  const list = STAGES[stage].lines;
  if (changed) {
    drawLine(list[sent]);
    const el = $('line');
    el.classList.remove('fade');
    void el.offsetWidth;
    el.classList.add('fade');
    const dots = $('dots');
    dots.textContent = '';
    if (list.length > 1) {
      list.forEach(function (x, i) {
        const d = document.createElement('span');
        if (i === sent) { d.className = 'on'; }
        dots.appendChild(d);
      });
    }
  }
  $('stepLabel').textContent = stepName(stage);
  $('count').textContent = stage + ' / ' + LAST;
  $('barFill').style.width = (stage / LAST * 100) + '%';

  const next = $('nextBtn');
  if (speaking) {
    next.textContent = '말하는 중';
    next.disabled = true;
  } else if (stage >= LAST) {
    next.textContent = '토의 끝';
    next.disabled = true;
  } else {
    next.textContent = stage === 0 ? '토의 시작' : '다음 멘트';
    next.disabled = false;
  }
  $('prevBtn').disabled = stage <= 1;
  $('replayBtn').textContent = speaking ? '멈춤' : (stage === 0 ? '안내 듣기' : '다시 듣기');
  if (stage >= LAST) {
    $('nextHint').textContent = '모든 멘트가 끝났습니다.';
  } else if (stage === 0) {
    $('nextHint').textContent = '다음 순서: ' + stepName(1);
  } else {
    $('nextHint').textContent = '다음 순서: ' + stepName(stage + 1) + ' (사회자 차례가 되면 눌러 주세요)';
  }
}

function openScript(i) {
  stopSpeaking();
  book = BOOKS[i];
  stage = 0;
  sent = 0;
  $('bookTitle').textContent = book.title;
  $('pick').hidden = true;
  $('stage').hidden = false;
  render(true);
}
function buildPick() {
  const box = $('pickList');
  BOOKS.forEach(function (b, i) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pickBtn';
    btn.textContent = b.title;
    btn.addEventListener('click', function () { openScript(i); });
    box.appendChild(btn);
  });
}

$('nextBtn').addEventListener('click', function () {
  if (!speaking && stage < LAST) { play(stage + 1); }
});
$('prevBtn').addEventListener('click', function () {
  if (stage > 1) { play(stage - 1); }
});
$('replayBtn').addEventListener('click', function () {
  if (speaking) { stopSpeaking(); }
  else { play(stage); }
});
$('backBtn').addEventListener('click', function () {
  if (stage === 0 || window.confirm('책 고르기 화면으로 돌아갈까요? 진행 순서는 처음으로 돌아갑니다.')) {
    stopSpeaking();
    $('stage').hidden = true;
    $('pick').hidden = false;
  }
});
$('voiceSel').addEventListener('change', function (e) {
  store.set('mcVoiceKey', e.target.value);
  const v = currentVoice();
  $('voiceNow').textContent = v ? v.name : '-';
  speakSample();
});
$('rateInp').addEventListener('input', function (e) {
  rate = parseFloat(e.target.value);
  $('rateVal').textContent = rate.toFixed(2);
  store.set('mcRate', String(rate));
});
$('pitchInp').addEventListener('input', function (e) {
  pitch = parseFloat(e.target.value);
  $('pitchVal').textContent = pitch.toFixed(2);
  store.set('mcPitch', String(pitch));
});
$('testBtn').addEventListener('click', speakSample);
document.addEventListener('keydown', function (e) {
  if ($('stage').hidden) { return; }
  const tag = (e.target && e.target.tagName) || '';
  if (/^(BUTTON|SELECT|INPUT|SUMMARY)$/.test(tag)) { return; }
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') {
    e.preventDefault();
    $('nextBtn').click();
  } else if (e.key === 'ArrowLeft') {
    $('prevBtn').click();
  } else if (e.key === 'r' || e.key === 'R') {
    $('replayBtn').click();
  }
});
window.addEventListener('beforeunload', function () { if (synth) { synth.cancel(); } });

$('rateInp').value = rate;
$('rateVal').textContent = rate.toFixed(2);
$('pitchInp').value = pitch;
$('pitchVal').textContent = pitch.toFixed(2);

if (synth) {
  loadVoices();
  if (typeof synth.addEventListener === 'function') {
    synth.addEventListener('voiceschanged', loadVoices);
  } else {
    synth.onvoiceschanged = loadVoices;
  }
  setTimeout(function () {
    loadVoices();
    if (!voices.length) {
      showNotice('이 기기에서 한국어 목소리를 찾지 못했습니다. 소리가 나지 않으면 크롬이나 엣지 브라우저로 열어 주세요. 자막은 그대로 한 문장씩 넘어갑니다.');
    }
  }, 2500);
} else {
  showNotice('이 브라우저는 음성 읽기를 지원하지 않아 자막만 표시됩니다. 크롬이나 엣지 브라우저로 열어 주세요.');
}

buildPick();
</script>
</body>
</html>
